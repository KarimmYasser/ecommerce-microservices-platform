server:
  port: 8083

spring:
  application:
    name: shop-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shop_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

jwt:
  secret: ${JWT_SECRET:default-super-secret-key-change-in-production-must-be-at-least-256-bits!}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        register-health-indicator: true
    instances:
      inventoryCheck:
        base-config: default
      inventoryReserve:
        base-config: default
        ignore-exceptions:
          - feign.FeignException$Conflict
          - com.ejada.ecommerce.shop.exception.InsufficientStockException
      walletDebit:
        base-config: default
        ignore-exceptions:
          - com.ejada.ecommerce.shop.exception.PaymentFailedException
  timelimiter:
    configs:
      default:
        timeout-duration: 2s
    instances:
      walletDebit:
        base-config: default
      inventoryReserve:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
    instances:
      inventoryRelease:
        base-config: default
      walletCredit:
        base-config: default
