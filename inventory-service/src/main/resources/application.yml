server:
  port: 8081

spring:
  application:
    name: inventory-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/inventory_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true   # keeps the entered JWT applied to every call after one Authorize

# JWT validation shares the secret issued by wallet-service. No default here —
# must be supplied via environment. See docs/security/authentication-authorization.md
jwt:
  secret: ${JWT_SECRET}
