server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false   # explicit routes only — never auto-expose every registered service
      routes:
        - id: wallet-auth
          uri: lb://wallet-service
          predicates:
            - Path=/api/v1/auth/**
        - id: wallet
          uri: lb://wallet-service
          predicates:
            - Path=/api/v1/wallets/me/**,/api/v1/users/**
        - id: inventory-public
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**
        - id: shop
          uri: lb://shop-service
          predicates:
            - Path=/api/v1/cart/**,/api/v1/wishlist/**,/api/v1/orders/**,/api/v1/reviews/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

# JWT edge validation (docs/security/authentication-authorization.md) is wired
# up in Phase 4 as a GlobalFilter using this secret. No default — must be
# supplied via environment so a real secret is never accidentally used.
jwt:
  secret: ${JWT_SECRET}
