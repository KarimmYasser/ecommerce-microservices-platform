server:
  port: 8082

spring:
  application:
    name: wallet-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wallet_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

jwt:
  secret: ${JWT_SECRET:default-super-secret-key-change-in-production-must-be-at-least-256-bits!}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
